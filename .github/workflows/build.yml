name: Build DoorWatch

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - 'web/**'
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Web ───────────────────────────────────────────────────────────────────
  web:
    name: Build Web (HA panel)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --base-href /local/doorwatch/

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Zip the web build for the GitHub release (all users download this)
      - name: Create web.zip
        run: |
          cd build/web
          zip -r ../../web.zip .

      - name: Upload web artifact (for deploy job)
        uses: actions/upload-artifact@v4
        with:
          name: doorwatch-web
          path: build/web/
          retention-days: 1

      - name: Attach web.zip to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DoorWatch v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: web.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy to Synology → HA (personal, runs only on main) ─────────────────
  deploy-synology:
    name: Deploy to Home Assistant via Synology
    runs-on: self-hosted
    needs: web
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: doorwatch-web
          path: build/web

      # Runner is on the NAS — SSH directly to the RPi.
      # Required secrets:
      #   NAS_HA_PATH  – destination path on the RPi, e.g. /config/www/doorwatch
      #   HA_URL       – Home Assistant URL, e.g. http://192.168.100.97:8123
      #   HA_TOKEN     – Long-lived access token from HA profile
      # SSH key is mounted at /root/.ssh/id_ed25519_doorwatch via Docker volume.
      - name: Add RPi to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 192.168.100.97 >> ~/.ssh/known_hosts

      - name: Deploy build to RPi
        run: |
          ssh -i ~/.ssh/id_ed25519_doorwatch \
              -o StrictHostKeyChecking=no \
              root@192.168.100.97 \
              "mkdir -p ${{ secrets.NAS_HA_PATH }}"
          tar -C build/web -czf - . | \
            ssh -i ~/.ssh/id_ed25519_doorwatch \
                -o StrictHostKeyChecking=no \
                root@192.168.100.97 \
                "cd ${{ secrets.NAS_HA_PATH }} && tar -xzf -"

      - name: Reload HA frontend via API
        run: |
          curl -s -o /dev/null -w '%{http_code}' \
            -X POST "${{ secrets.HA_URL }}/api/services/homeassistant/reload_all" \
            -H "Authorization: Bearer ${{ secrets.HA_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Notify deployment success
        run: |
          echo "✅ DoorWatch deployed to RPi:${{ secrets.NAS_HA_PATH }} and HA reloaded"

  # ── Android ───────────────────────────────────────────────────────────────
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build APK (release)
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release \
            --dart-define=FLAVOR=free \
            --build-name=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)

      - name: Build APK Pro
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter build apk --release \
            --dart-define=FLAVOR=pro \
            --build-name=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)-pro \
            --output=build/app/outputs/flutter-apk/app-release-pro.apk

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Attach APKs to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DoorWatch v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release-pro.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── iOS ───────────────────────────────────────────────────────────────────
  ios:
    name: Build iOS IPA
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios && pod install

      - name: Build iOS (no code sign)
        run: |
          flutter build ios --release --no-codesign

      - name: Archive IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r DoorWatch.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoorWatch-iOS
          path: build/ios/iphoneos/DoorWatch.ipa
          retention-days: 30

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Flutter analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/
        continue-on-error: true


