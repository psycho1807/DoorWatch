name: doorwatch
description: "Smart doorbell intercom app for Home Assistant"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Réseau ─────────────────────────────────────────────────────────────
  web_socket_channel: ^3.0.1       # WebSocket HA
  http: ^1.2.2                     # API REST HA

  # ── Firebase (notifications) ────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # ── Notifications locales ───────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── Stockage ────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2       # Config simple
  flutter_secure_storage: ^9.2.2   # Token HA (sécurisé)

  # ── UI ─────────────────────────────────────────────────────────────────
  go_router: ^14.3.0               # Navigation
  cached_network_image: ^3.4.1     # Cache image caméra
  url_launcher: ^6.3.1             # Ouvrir URLs externes (Gumroad…)
  intl: ^0.19.0                    # Formatage dates (historique)

  # ── Pro : Reconnaissance faciale ───────────────────────────────────────
  # tflite_flutter: ^0.11.0        # TensorFlow Lite (activé pour Pro)
  # camera: ^0.11.0                # Capture pour enregistrer visages
  # image: ^4.2.0                  # Traitement image

  # ── Pro : Intercom WebRTC ──────────────────────────────────────────────
  # flutter_webrtc: ^0.11.4        # WebRTC audio

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/            # Modèles TFLite (Pro)
    - assets/sounds/            # Sons de notification

  # fonts: []  # Utilise la police système par défaut
