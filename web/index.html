<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DoorWatch — Surveillance de porte d'entrée">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DoorWatch">

  <!-- Favicon -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DoorWatch</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fond noir pendant le chargement Flutter */
    body {
      margin: 0;
      background-color: #0D1117;
    }
  </style>
</head>
<body>
  <!-- TensorFlow.js CPU backend — forcé avant face-api.js pour éviter WebGL -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu@4.22.0/dist/tf-backend-cpu.min.js" crossorigin="anonymous"></script>
  <script>
    // Forcer le backend CPU avant le chargement de face-api.js
    if (typeof tf !== 'undefined') {
      tf.setBackend('cpu');
    }
  </script>

  <!-- face-api.js : modèles de reconnaissance faciale (Pro) -->
  <!-- Chargé en mode async — disponible quand FaceRecognizer.init() est appelé -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"
    crossorigin="anonymous"
  ></script>

  <!-- Bridge DoorWatch face-api ↔ Flutter -->
  <script defer src="face_api_bridge.js"></script>

  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
